services:
  - type: web
    name: styleby-backend
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm install && npm run build
    startCommand: npm run start
    envVars:
      # Enter your Gemini key in the Render dashboard when prompted during
      # Blueprint setup — get one at https://aistudio.google.com/app/apikey
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.5-flash-lite
      # Locks the API to the deployed frontend's origin. Update this if you
      # rename the frontend service below (Render URLs follow <name>.onrender.com).
      - key: CORS_ORIGIN
        value: https://styleby-frontend.onrender.com

  - type: web
    name: styleby-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    routes:
      # SPA fallback so client-side routes (e.g. /app/upload) don't 404 on
      # direct navigation or refresh.
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      # Must match the backend service's URL above (<name>.onrender.com).
      - key: VITE_API_BASE_URL
        value: https://styleby-backend.onrender.com
      # Optional — only needed if you want Supabase-backed closet storage
      # instead of the localStorage fallback. Leave blank to skip.
      - key: VITE_SUPABASE_URL
        sync: false
      - key: VITE_SUPABASE_ANON_KEY
        sync: false
